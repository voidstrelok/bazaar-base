services:
  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin by default: the host Nginx proxies /api to the API.
        # Set VITE_API_URL only when the API is intentionally deployed elsewhere.
        - VITE_API_URL=${VITE_API_URL:-}
        - VITE_STORE_NAME=${STORE_NAME:-Bazaar}
        - VITE_STORE_DESCRIPTION=${STORE_DESCRIPTION:-}
        - VITE_STORE_INSTAGRAM=${STORE_INSTAGRAM:-}
        - VITE_STORE_FACEBOOK=${STORE_FACEBOOK:-}
        - VITE_STORE_TWITTER=${STORE_TWITTER:-}
        - VITE_STORE_WHATSAPP=${STORE_WHATSAPP:-}
        - VITE_COLOR_PRIMARY=${COLOR_PRIMARY:-#6366f1}
        - VITE_COLOR_SECONDARY=${COLOR_SECONDARY:-#f59e0b}
        - VITE_PAYMENT_GATEWAY=${PAYMENT_GATEWAY:-transbank}
        - VITE_ENABLE_CHECKOUT=${ENABLE_CHECKOUT:-true}
        - VITE_CONTACT_TYPE=${CONTACT_TYPE:-none}
        - VITE_CONTACT_VALUE=${CONTACT_VALUE:-}
        - VITE_CONTACT_MESSAGE=${CONTACT_MESSAGE:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:?FRONTEND_PORT must be set}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tienda_network
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M

  api:
    build: ./api
    ports:
      - "127.0.0.1:${API_PORT:?API_PORT must be set}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=db;Port=5432;Database=${DB_NAME:?DB_NAME must be set};Username=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET must be set}
      - Jwt__Issuer=${JWT_ISSUER:-TiendaApi}
      - Jwt__Audience=${JWT_AUDIENCE:-TiendaApiUsers}
      - Jwt__ExpiryMinutes=${JWT_EXPIRY_MINUTES:-60}
      - Payment__Gateway=${PAYMENT_GATEWAY:-transbank}
      - Transbank__CommerceCode=${TRANSBANK_COMMERCE_CODE:-}
      - Transbank__ApiKey=${TRANSBANK_API_KEY:-}
      - Transbank__Environment=${TRANSBANK_ENVIRONMENT:-Integration}
      - MercadoPago__AccessToken=${MERCADOPAGO_ACCESS_TOKEN:-}
      - MercadoPago__WebhookSecret=${MERCADOPAGO_WEBHOOK_SECRET:-}
      - Storage__Provider=${STORAGE_PROVIDER:-local}
      - Storage__LocalPath=${LOCAL_STORAGE_PATH:-/app/uploads}
      - Cloudinary__Url=${CLOUDINARY_URL:-}
      - STORE_NAME=${STORE_NAME:-Bazaar}
      - CORS__Origins=${CORS_ORIGINS:-http://localhost:5173}
      - Admin__Email=${ADMIN_EMAIL:?ADMIN_EMAIL must be set}
      - Admin__Password=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      - Admin__Nombre=${ADMIN_NOMBRE:-Administrador}
      - Features__EnableCheckout=${ENABLE_CHECKOUT:-true}
      - SeedDemoData=${SEED_DEMO_DATA:-false}
      - Frontend__BaseUrl=${PUBLIC_BASE_URL:-}
      - PublicBaseUrl=${PUBLIC_BASE_URL:-}
      - Resend__ApiKey=${RESEND_API_KEY:-}
      - Resend__FromEmail=${RESEND_FROM_EMAIL:-}
      - Resend__FromName=${STORE_NAME:-Bazaar}
      - Orders__NotificationEmail=${ORDERS_NOTIFICATION_EMAIL:-}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tienda_network
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:?DB_NAME must be set}
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:?DB_NAME must be set}"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - tienda_network
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M

networks:
  tienda_network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
