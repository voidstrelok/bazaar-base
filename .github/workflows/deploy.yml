name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Update and restart Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust VPS host key x
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p 22022 -H thepit.cl >> ~/.ssh/known_hosts

      - name: Update repository and restart services
        run: |
          ssh deploy@thepit.cl -p 22022 \
            "cd bazaar && \
             git pull --ff-only origin main && \
             docker compose up -d --build --remove-orphans"
